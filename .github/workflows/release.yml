name: Release

# Push a tag like v0.3.2 to publish: wheel, source package and the Claude skill zip.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: Skill zip (upload in Claude → Settings → Skills)
        run: |
          mkdir -p dist/skill
          cp -r skill/mediasense dist/skill/
          (cd dist/skill && zip -r ../mediasense-skill.zip mediasense)
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz dist/mediasense-skill.zip \
            --title "mediasense $GITHUB_REF_NAME" --generate-notes
