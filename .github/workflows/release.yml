name: Release

# Push a tag like v0.4.1 to publish:
#   - the Python package on PyPI (trusted publishing, see README "Releasing")
#   - the server entry in the official MCP Registry (server.json)
#   - a GitHub release with the wheel, the Claude skill zip and the Claude Desktop extension (.mcpb)
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub release
      id-token: write   # PyPI trusted publishing
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Check the tag matches the package version
        run: |
          V=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$V" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != version $V in pyproject.toml"; exit 1; }
          for f in server.json .claude-plugin/plugin.json; do
            test "$(jq -r .version $f)" = "$V" || { echo "$f version != $V"; exit 1; }
          done
          grep -q "\"mediasense==$V\"" .mcp.json || { echo ".mcp.json must run mediasense==$V"; exit 1; }
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Build the Python package
        run: pip install build && python -m build

      - name: Skill zip (upload in Claude → Settings → Skills)
        run: |
          mkdir -p out/skill
          cp -r skills/mediasense out/skill/
          (cd out/skill && zip -r ../mediasense-skill.zip mediasense)

      - name: Claude Desktop extension (.mcpb)
        run: |
          cp -r mcpb out/ext
          sed -i "s/\"version\": \"0.0.0\"/\"version\": \"$VERSION\"/" out/ext/manifest.json
          sed -i "s/0\.0\.0/$VERSION/g" out/ext/pyproject.toml
          npx -y @anthropic-ai/mcpb validate out/ext/manifest.json
          npx -y @anthropic-ai/mcpb pack out/ext out/mediasense.mcpb

      - name: Publish to PyPI
        # needs the one-time trusted-publisher setup on pypi.org; the GitHub release is made either way
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Publish to the MCP Registry (registry.modelcontextprotocol.io)
        # needs the PyPI upload above: the registry checks for "mcp-name:" in the PyPI description
        continue-on-error: true
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json
          ./mcp-publisher login github-oidc
          for i in 1 2 3 4 5; do ./mcp-publisher publish && exit 0; sleep 30; done; exit 1

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz out/mediasense-skill.zip out/mediasense.mcpb \
            --title "mediasense $GITHUB_REF_NAME" --generate-notes
