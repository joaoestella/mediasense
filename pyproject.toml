[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mediasense"
version = "0.3.2"
description = "Give Claude ears and eyes: understand, summarize and edit audio/video files or links (TikTok, YouTube…) with word-level timestamps. MCP server + CLI, runs locally."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["whisper", "transcription", "word timestamps", "video editing", "subtitles", "mcp", "claude", "ffmpeg"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Multimedia :: Video :: Non-Linear Editor",
]
dependencies = ["pillow>=9.0"]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0", "numpy"]
whisperx = ["whisperx>=3.1"]
api = ["openai>=1.30"]
url = ["yt-dlp[default,curl-cffi]>=2024.1"]
mcp = ["mcp>=1.2"]
all = ["faster-whisper>=1.0", "numpy", "mcp>=1.2", "yt-dlp[default,curl-cffi]>=2024.1"]
dev = ["pytest>=7", "ruff", "numpy"]

[project.scripts]
mediasense = "mediasense.cli:main"

[project.urls]
Homepage = "https://github.com/joaoestella/mediasense"
Issues = "https://github.com/joaoestella/mediasense/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mediasense"]

[tool.hatch.build.targets.wheel.force-include]
# ship the Claude skill inside the package so `mediasense setup` / `mediasense skill` can install it
"skill/mediasense/SKILL.md" = "mediasense/_skill/SKILL.md"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
"src/mediasense/export.py" = ["E501"]  # FCPXML template
